services:
  - type: web
    name: humanfallback
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: SESSION_SECRET
        generateValue: true
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_TEXT_MODEL
        value: minimax-m3.1-flash
      - key: OLLAMA_VISION_MODEL
        value: gemma4:31b
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: HF_DATA_DIR
        value: /var/data
    disk:
      name: humanfallback-data
      mountPath: /var/data
      sizeGB: 1
